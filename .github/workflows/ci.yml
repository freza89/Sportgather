name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sportgather
          POSTGRES_PASSWORD: sportgather
          POSTGRES_DB: sportgather
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sportgather"
          --health-interval 5s
          --health-retries 10
    env:
      # Tes membuat database sementara sendiri (sg_test_*) dan e2e memakai sportgather_e2e.
      DATABASE_ADMIN_URL: postgres://sportgather:sportgather@localhost:55432/sportgather
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit & integrasi (termasuk tes isolasi tenant RLS)
        run: pnpm test
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @sportgather/e2e exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm --filter @sportgather/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results
          retention-days: 7
