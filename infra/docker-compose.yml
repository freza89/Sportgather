# Infrastruktur lokal SportGather. Port dibuat non-standar agar tidak bentrok dengan project lain.
name: sportgather

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sportgather
      POSTGRES_PASSWORD: sportgather
      POSTGRES_DB: sportgather
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sportgather']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Object storage kompatibel S3 untuk dokumen usia (lihat ADR-005: MinIO tidak lagi merilis image Docker).
  s3:
    image: chrislusf/seaweedfs:4.55
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '59000:8333'
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - '58025:8025'
      - '51025:1025'

volumes:
  pgdata:
  s3data:
